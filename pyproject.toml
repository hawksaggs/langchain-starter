[project]
name = "hello-agent"
version = "0.1.0"
description = "Hello World AI agent built with LangChain + Groq, served via Streamlit"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-groq>=1.0",
    "langchain-core>=1.0",
    "streamlit>=1.38",
    "python-dotenv>=1.2.3",
    "openai>=3.14.1",
    "groq>=0.37.1",
]

[tool.uv]
package = false
